[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kagi-translate-client"
version = "0.1.0"
description = "API client for Kagi Translate: text translation, detection, dictionary and website translation"
readme = "README.md"
license = { text = "RPL-1.5" }
authors = [{ name = "Benjamin Lupton", email = "b@lupton.cc" }]
requires-python = ">=3.9"

[project.scripts]
kagi-translate = "kagi_translate:main"

[tool.setuptools]
py-modules = ["kagi_translate"]
